name: Job search notify

on:
  workflow_dispatch:
  schedule:
    # Free / BASIC RapidAPI tier: ONE run per day (10 AM EST = 15:00 UTC, EST = UTC−5).
    # Doubles JSearch usage if you uncomment the second line (evening) — only if your plan allows it.
    - cron: "0 15 * * *"
    # - cron: "0 0 * * *"   # 7 PM EST — paid / higher quota only

permissions:
  contents: read
  # Explicit token scopes so actions/cache restore+save work (narrow defaults otherwise disable cache writes).
  actions: write

concurrency:
  group: job-hunter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Save uses a new key each run (run_id) so GitHub does not reject overwriting the entry we restored.
      # restore-keys prefix matches old keys (…/main) and new keys (…/main-<run_id>); newest wins.
      - name: Restore posted_jobs.json
        uses: actions/cache/restore@v5
        with:
          path: .data/posted_jobs.json
          key: job-hunter-posted-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            job-hunter-posted-${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run job hunter
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Provider: uncomment one. `jobs_search` = JOBS SEARCH API (rphrp1985); `jsearch` = JSearch (letscrape).
          # JOB_SEARCH_PROVIDER: jsearch
          JOB_SEARCH_PROVIDER: jobs_search
        run: python src/main.py

      - name: Save posted_jobs.json
        if: always() && hashFiles('.data/posted_jobs.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .data/posted_jobs.json
          key: job-hunter-posted-${{ github.ref }}-${{ github.run_id }}
