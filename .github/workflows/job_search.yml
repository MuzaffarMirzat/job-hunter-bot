name: Job search notify

on:
  workflow_dispatch:
  schedule:
    # 8:00 AM EST ≈ 13:00 UTC (standard time); 6:00 PM EST ≈ 23:00 UTC
    - cron: "0 13 * * *"
    - cron: "0 23 * * *"

permissions:
  contents: read
  # Explicit token scopes so actions/cache restore+save work (narrow defaults otherwise disable cache writes).
  actions: write

concurrency:
  group: job-hunter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore posted_jobs.json
        uses: actions/cache/restore@v4
        with:
          path: .data/posted_jobs.json
          key: job-hunter-posted-${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run job hunter
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py

      - name: Save posted_jobs.json
        if: always() && hashFiles('.data/posted_jobs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .data/posted_jobs.json
          key: job-hunter-posted-${{ github.ref }}
